[project]
name = "hanabi_data"
version = "0.1.0"
description = "Hanabi game records -> decision records (docs/representation.md)"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[dependency-groups]
dev = [
    "numpy>=1.22",
    "pytest>=8",
    "pytest-xdist>=3",
    "websocket-client>=1.6",  # .claude/skills/review-ui-check/scripts/cdp.py
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
